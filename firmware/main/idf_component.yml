## IDF Component Manager manifest
## Run: idf.py update-dependencies
## This pulls all display, touch, and LVGL components from the Espressif component registry.

dependencies:
  idf: ">=5.3"

  ## LVGL 9 with IDF port
  espressif/esp_lvgl_port:
    version: "^2"

  ## GT911 capacitive touch driver (I2C, GPIO7/8)
  espressif/esp_lcd_touch_gt911:
    version: "^1"

  ## MQTT client (built into IDF, listed for clarity)
  ## esp_mqtt is part of IDF — no separate component needed

  ## ST7703 MIPI-DSI panel driver
  waveshare/esp_lcd_st7703:
    version: "*"

  ## Official Waveshare BSP (same version used by the working lvgl_demo_v9)
  waveshare/esp32_p4_wifi6_touch_lcd_4b:
    version: "*"

  ## ESP32-P4 WiFi via ESP32-C6 companion — disabled for UI bring-up
  ## Re-enable for Phase 3:
  # espressif/esp_wifi_remote:
  #   version: "*"
  # espressif/esp_hosted:
  #   version: "*"
