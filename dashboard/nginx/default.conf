server {
    listen 80;
    server_name _;

    location /dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ =404;
    }

    location /editor/ {
        alias /usr/share/nginx/html/editor/;
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
