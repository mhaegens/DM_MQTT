server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / { return 302 /dashboard/; }

    # Same-origin WebSocket path: works on LAN and through the HTTP tunnel,
    # avoids a hard-coded browser port and keeps one connection to Mosquitto.
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /assets/site-config.js {
        try_files /assets/site-config.local.js /assets/site-config.js =404;
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ~ ^/(dashboard|editor|shopfloor|config-editor|previews)/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
