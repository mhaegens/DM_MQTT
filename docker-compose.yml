services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sapdm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # plain TCP — local tools (internal only)
      - "9001:9001"   # WebSocket — ESP32-P4 + SAP DM (via Cloudflare Tunnel) + browser dashboard
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  dashboard:
    image: nginx:alpine
    container_name: sapdm-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dashboard/html:/usr/share/nginx/html:ro
      - ./dashboard/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: sapdm-net
